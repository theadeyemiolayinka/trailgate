# Manual release: bumps any queued changesets into real versions, runs the
# full gate, and publishes a GitHub Release with the agent bundles, package
# tarballs, and checksums. Trigger from the Actions tab (or `gh workflow
# run release.yml`). Nothing ships on push; a release happens only when
# someone runs this workflow.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<agent-cli version>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Materialize queued changesets into version bumps + CHANGELOGs.
      - name: version packages
        run: |
          pnpm changeset version
          pnpm install --lockfile-only

      - name: commit version bump
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): version packages"
            git push
          else
            echo "no version changes"
          fi

      - run: pnpm release

      - name: resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./packages/agent-cli/package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$TAG" || true
          git push origin "$TAG" || true
          gh release create "$TAG" dist-release/* \
            --title "TrailGate $TAG" \
            --notes "Experimental release. Install: docs/INSTALL_AND_DEPLOY.md. Changelogs: per-package CHANGELOG.md."
